;number of STA <= 19!
;-------  for v.>=12 ------------------------------
;GMT shift
TME 3
;time border for rounding
;T_B 10
;format index name konst "time border for rounding"
STA RUSI Sochi-Ahun 0 3
;
; Stations whose BUFR uses the DMRL long-name layout: it carries no
; latin site name, so debufr leaves header.wrk's name empty and the
; radar becomes nameless - and a nameless radar is dropped from the
; radar list, so it never appears on a map.  Names below are the latin
; form of the CP1251 name in the same message, each agreeing with the
; position the BUFR reports.  A name is ONE token: the parser takes
; field 3 and no more, so a space would truncate it.
;        code  name       lat        lon
STA RUEK Koltsovo 0 3
STA RUSP Pulkovo 0 3
STA UMBB Brest 0 3
STA UMII Vitebsk 0 3
STA UMMG Grodno 0 3
STA UMGG Gomel 0 3
STA UMMN Minsk 0 3

