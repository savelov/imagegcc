name: macos

# macOS build.  Nothing here was tried before committing - there is no Mac on
# the development machine - so treat the first run as the real test.
#
# Only gen-bitmap and imageqt are expected to matter:
#   gen-bitmap  renders into RAM frame contexts, no video driver at all
#   imageqt     drives GRX's "memory" driver and lets Qt do the display
# imagegcc needs a real X11 display to run, but it still links here because
# the X11 libraries come from Homebrew, so it is built and shipped anyway.
#
# GRX has no macOS makefile; makefile.x11 is used with the X11 paths pointed
# at Homebrew rather than the /usr that patch 01 sets for Linux.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  clang-macos:
    # macos-latest is Apple silicon; add macos-13 to the matrix for intel
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          brew update -q
          brew install pkg-config libpng proj minizip qt libx11 libxext
          brew install dylibbundler

      - name: Point the toolchain at Homebrew
        run: |
          BREW=$(brew --prefix)
          echo "CPATH=$BREW/include"                  >> $GITHUB_ENV
          echo "LIBRARY_PATH=$BREW/lib"               >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$BREW/lib/pkgconfig:$(brew --prefix qt)/lib/pkgconfig" >> $GITHUB_ENV
          echo "MOC=$(brew --prefix qt)/share/qt/libexec/moc" >> $GITHUB_ENV
          echo "BREW=$BREW" >> $GITHUB_ENV

      - name: Provide the GRX sources
        env:
          GRX_URL: ${{ vars.GRX_URL || 'http://grx.gnu.de/download/grx249.tar.gz' }}
          GRX_SHA256: ${{ vars.GRX_SHA256 || 'a899956b3ee46492696114d220431405320c64c1f6f058fdfc2b4d6a2beae786' }}
        run: |
          set -e
          if [ -d third_party/grx249 ]; then
            cp -r third_party/grx249 grx-build
          else
            curl -fL "$GRX_URL" -o grx-src.tar.gz
            # macOS has shasum, not sha256sum
            echo "$GRX_SHA256  grx-src.tar.gz" | shasum -a 256 -c -
            mkdir grx-build
            tar xzf grx-src.tar.gz -C grx-build --strip-components=1
          fi
          test -f grx-build/makedefs.grx

      - name: Apply the GRX patches
        run: |
          set -e
          for p in grx-patches/*.patch; do
            echo "applying $p"
            patch -N -p1 -d grx-build < "$p"
          done

      # X11BASE is /usr on linux; on macOS the headers live under Homebrew.
      # -m64 is already skipped: patch 01 only emits it when uname -m is x86.
      # gcc is clang here, and clang accepts -fpermissive then ignores it,
      # so LEGACY_C names the relaxations the way the arm64 job does.
      - name: Build GRX
        run: |
          make -C grx-build -f makefile.x11 libs \
            X11INCS="-I$BREW/include" \
            X11LIBS="-L$BREW/lib -lX11" \
            LEGACY_C="-std=gnu89 -Wno-implicit-int -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-return-type -Wno-deprecated-non-prototype"

      - name: Build the tools
        run: GRX=grx-build ./make.sh

      - name: Run the GRX probes
        run: cd tests && GRX=../grx-build ./run-tests.sh

      - name: Collect the bundle
        run: |
          set -e
          mkdir -p dist
          for b in gen-bitmap imagegcc; do
            [ -f "$b" ] && cp "$b" dist/
          done
          # imageqt goes in a .app.  Not for the sake of looking native: it is
          # the only shape macdeployqt will work on, and macdeployqt is what
          # can relocate Qt's frameworks - dylibbundler skips .framework
          # bundles, which is why the first attempt at this left imageqt still
          # loading QtWidgets out of Homebrew.
          if [ -f imageqt ]; then
            APP=dist/imageqt.app
            mkdir -p $APP/Contents/MacOS
            cp imageqt $APP/Contents/MacOS/imageqt
            cat > $APP/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>imageqt</string>
            <key>CFBundleIdentifier</key><string>ru.imagegcc.imageqt</string>
            <key>CFBundleName</key><string>imageqt</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>550</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          fi
          cp -r config paths dist/ 2>/dev/null || true
          ls -lR dist | head -30

      # Copy every Homebrew dylib the binaries need into dist/libs and point
      # the install names at it, so the bundle runs on a Mac that has never
      # seen Homebrew.  @executable_path resolves against the main executable
      # even for a dlopen'd plugin, so one prefix serves both.
      - name: Bundle the dylibs
        run: |
          set -eo pipefail

          # The two command line tools link plain dylibs, which dylibbundler
          # handles: one invocation for both, so a shared library is copied
          # once and both point at the same file.
          FIX=""
          for f in dist/gen-bitmap dist/imagegcc; do
            [ -f "$f" ] && FIX="$FIX -x $f"
          done
          dylibbundler -of -b -cd $FIX -d dist/libs -p @executable_path/libs/
          echo "== $(ls dist/libs 2>/dev/null | wc -l) libraries in dist/libs"

          # imageqt needs Qt's own tool.  macdeployqt copies the frameworks
          # into the app, brings the plugins - which are dlopen'd, so nothing
          # links them - writes the qt.conf that points at them, and rewrites
          # every install name.  It is not on PATH under Homebrew.
          MDQ=""
          for c in "$(brew --prefix qt 2>/dev/null)/share/qt/bin/macdeployqt" \
                   "$(brew --prefix qt 2>/dev/null)/bin/macdeployqt" \
                   "$(brew --prefix qtbase 2>/dev/null)/share/qt/bin/macdeployqt" \
                   "$(brew --prefix qtbase 2>/dev/null)/bin/macdeployqt"; do
            [ -x "$c" ] && MDQ="$c" && break
          done
          [ -n "$MDQ" ] || { echo "cannot find macdeployqt"; exit 1; }
          echo "macdeployqt: $MDQ"
          "$MDQ" dist/imageqt.app -verbose=1

          # The smoke test runs on the offscreen platform; macdeployqt only
          # brings the plugins it thinks are needed, so make sure of that one.
          PLUG=dist/imageqt.app/Contents/PlugIns/platforms
          if [ -d "$PLUG" ] && [ ! -f "$PLUG/libqoffscreen.dylib" ]; then
            for c in "$(brew --prefix qt)/share/qt/plugins/platforms" \
                     "$(brew --prefix qtbase)/share/qt/plugins/platforms"; do
              if [ -f "$c/libqoffscreen.dylib" ]; then
                cp "$c/libqoffscreen.dylib" "$PLUG/"
                # re-point it at the frameworks macdeployqt just placed
                "$MDQ" dist/imageqt.app >/dev/null 2>&1 || true
                break
              fi
            done
          fi
          # macdeployqt brings every plugin category it knows about - the
          # virtual keyboard, the SVG icon engine, image formats, QML - and
          # those link Qt modules this program never uses, which it then does
          # not copy in.  They never load, so the app runs, but they are real
          # dangling references and there is no reason to ship them.  Keep the
          # platform plugins, which Qt does dlopen, and the style.
          PLUGROOT=dist/imageqt.app/Contents/PlugIns
          if [ -d "$PLUGROOT" ]; then
            for d in "$PLUGROOT"/*/; do
              case "$(basename "$d")" in
                platforms|styles) ;;
                *) echo "dropping plugin category $(basename "$d")"; rm -rf "$d" ;;
              esac
            done
            find "$PLUGROOT/platforms" -name '*.dylib' \
                 ! -name 'libqcocoa.dylib' ! -name 'libqoffscreen.dylib' \
                 -print -delete 2>/dev/null || true
          fi
          echo "== plugins kept:"; ls -R "$PLUGROOT" 2>/dev/null || echo "(none)"

          # macdeployqt relocates Qt thoroughly but is shallow about the
          # non-Qt libraries a Qt framework itself pulls in - QtDBus arrives
          # needing libdbus, which is left in Homebrew.  Sweep whatever is
          # still pointing outside, copy it into Frameworks and repoint it.
          # Repeat until nothing changes, since a copied library can bring
          # dependencies of its own.
          FWDIR=dist/imageqt.app/Contents/Frameworks
          mkdir -p "$FWDIR"
          for pass in 1 2 3 4; do
            moved=0
            for f in $(find dist/imageqt.app -type f); do
              if ! file "$f" | grep -q 'Mach-O'; then continue; fi
              own=$(otool -D "$f" | sed -n 2p)
              for d in $(otool -L "$f" | awk 'NR>1 && $1 ~ /^\/opt\/homebrew\// {print $1}'); do
                # a library names itself first; that is its id, not a need
                if [ "$d" = "$own" ]; then continue; fi
                base=$(basename "$d")
                if [ ! -f "$FWDIR/$base" ]; then
                  cp "$d" "$FWDIR/$base"
                  install_name_tool -id "@rpath/$base" "$FWDIR/$base"
                fi
                install_name_tool -change "$d" "@rpath/$base" "$f"
                echo "  pass $pass: repointed $base in $(basename "$f")"
                moved=1
              done
            done
            if [ "$moved" -eq 0 ]; then break; fi
          done

          # Rewriting an install name invalidates the signature, and arm64
          # macOS refuses to run a binary whose signature does not match - it
          # is killed on load with no useful message, which would look like a
          # broken build rather than a broken bundling step.  Ad-hoc is enough
          # for something the user runs themselves.  Libraries first, then the
          # executables that reference them.
          find dist/libs -name '*.dylib' -print0 2>/dev/null \
            | xargs -0 -r codesign --force --sign - 2>/dev/null || true
          for b in dist/gen-bitmap dist/imagegcc; do
            [ -f "$b" ] && codesign --force --sign - "$b" || true
          done
          codesign --force --deep --sign - dist/imageqt.app || true
          codesign --verify --deep dist/imageqt.app \
            && echo "imageqt.app signature verifies" \
            || echo "codesign --verify complained"

      # --- does it actually run? -----------------------------------------
      # Building proves nothing about a platform nobody here can boot, so
      # render on the runner and keep the picture.  Both tools are headless:
      # gen-bitmap never opens a window, and imageqt takes IMAGEQT_SHOT plus
      # Qt's offscreen platform.  Runs after the bundle step so dist/ keeps
      # the tracked paths file rather than the one written here.
      - name: Smoke test - render every product family
        run: |
          set -eo pipefail
          # tests/data is built from the BUFR messages in tests/bufr - see
          # tests/README.  mapdir is char[80] in files.c, so a long absolute
          # MAP path is silently truncated; keep it relative.
          printf 'WRK RAB\nMAP tests/data\nCFG config\nGRF config\n' > paths
          mkdir -p renders

          # Name the frame and the product rather than taking the defaults:
          # without arguments the tools open the newest frame, which in this
          # fixture carries one product, and every check below would be
          # measuring an empty map.  time<HH>:<MM> picks the frame.
          render() {
            label=$1; shift
            rm -f output.png
            dist/gen-bitmap "$@" > "renders/$label.log" 2>&1 \
              || { echo "FAIL: gen-bitmap $* exited non-zero";
                   cat "renders/$label.log"; exit 1; }
            # "no product" means the raster was missing and the map came out
            # empty, which the exit status does not report.
            if grep -qE 'Cannot open zip file|no product in this file' \
                    "renders/$label.log"; then
              echo "FAIL: $label did not load"; cat "renders/$label.log"; exit 1
            fi
            [ -f output.png ] || { echo "FAIL: $label wrote no png"; exit 1; }
            sz=$(wc -c < output.png)
            # a blank 1500x1100 frame is a few kB; a real one is 55-65 kB
            [ "$sz" -gt 20000 ] \
              || { echo "FAIL: $label looks blank ($sz bytes)"; exit 1; }
            printf '  %-14s %6s bytes  (%s)\n' "$label" "$sz" "$*"
            mv output.png "renders/$label.png"
          }

          # dist/ binaries, so the smoke test exercises the bundle that ships
          echo "== gen-bitmap, one render per product family"
          render reflectivity time22:00 map1
          render maxreflect   time22:00 map0
          render zdr          time22:00 zdr2
          render height       time22:00 top
          render phenomena    time22:00 phenom
          render rainfall     time22:00 sum1
          render velocity     time10:50 vel1

          # Every product must look different.  Identical renders would mean
          # the selection was ignored and one raster was drawn seven times.
          # md5 on macOS, md5sum elsewhere - same script then runs on linux
          if command -v md5 >/dev/null 2>&1; then HASH="md5 -q"; else HASH=md5sum; fi
          n=$(ls renders/*.png | wc -l)
          u=$($HASH renders/*.png | awk '{print $1}' | sort -u | wc -l)
          echo "  $n renders, $u distinct"
          [ "$u" -eq "$n" ] || { echo "FAIL: products render identically"; exit 1; }

          echo "== imageqt (offscreen)"
          QT_QPA_PLATFORM=offscreen IMAGEQT_SHOT=renders/imageqt-macos.png \
            dist/imageqt.app/Contents/MacOS/imageqt time22:00 zdr2 \
              > renders/imageqt.log 2>&1 \
            || { cat renders/imageqt.log; exit 1; }
          cat renders/imageqt.log
          sz=$(wc -c < renders/imageqt-macos.png)
          echo "  imageqt window: $sz bytes"
          [ "$sz" -gt 20000 ] || { echo "FAIL: the window looks blank"; exit 1; }

          echo "smoke test passed"

      # The same fixture, out as data rather than as a picture: one GeoTIFF per
      # product family, each read back and checked - size, palette, geo tags,
      # per product no-data byte and the pixels.  No GDAL on the runner, so
      # tests/geotiff-check.py parses the TIFF itself.
      - name: GeoTIFF output
        run: BIN=dist/gen-bitmap ./tests/geotiff-test.sh

      - name: Keep the rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagegcc-macos-${{ runner.arch }}-render
          path: renders
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagegcc-macos-${{ runner.arch }}
          path: dist
          if-no-files-found: error

      # --- would it run on a Mac without Homebrew? -----------------------
      # Static half: walk the link graph and classify every dependency.
      # Reports rather than gates - the bundle is known not to be standalone
      # today, and a red build would just restate that.  Set the repository
      # variable STRICT_STANDALONE=1 to turn the verdict into a failure once
      # the dylibs are actually bundled.
      - name: Audit the dynamic dependencies
        if: always()
        env:
          STRICT: ${{ vars.STRICT_STANDALONE || '0' }}
        run: |
          python3 - "$STRICT" <<'PY'
          import subprocess, sys, os, collections
          strict = sys.argv[1] == "1"
          roots = ["dist/gen-bitmap", "dist/imagegcc",
                   "dist/imageqt.app/Contents/MacOS/imageqt"]
          roots = [r for r in roots if os.path.exists(r)]

          def run(args):
              try:
                  return subprocess.run(args, check=True, capture_output=True,
                                        text=True).stdout
              except Exception:
                  return ""

          def deps(path):
              out = run(["otool", "-L", path])
              if not out:
                  return []
              names = [l.split(" (")[0].strip()
                       for l in out.splitlines()[1:] if l.startswith("\t")]
              # For a library, otool -L lists the library's own install name
              # first.  That is what it calls itself, not something it needs,
              # and counting it reports every library whose id was left at its
              # build location as a missing dependency of itself.
              own = run(["otool", "-D", path]).splitlines()
              own = own[1].strip() if len(own) > 1 else None
              if own and names and names[0] == own:
                  names = names[1:]
              return names

          SYSTEM = ("/usr/lib/", "/System/Library/")
          seen, external = set(), collections.defaultdict(set)

          def resolve(dep, cur, exedir):
              # A bundled library names itself relative to the executable that
              # loaded it, or to itself.  Follow it so its own dependencies are
              # checked too - otherwise a nested library still pointing at
              # Homebrew, or a plugin needing something that never got copied,
              # would pass as standalone.  @rpath is resolved the way
              # macdeployqt lays an app out.
              if dep.startswith("@executable_path/"):
                  return [os.path.join(exedir, dep[len("@executable_path/"):])]
              if dep.startswith("@loader_path/"):
                  return [os.path.join(os.path.dirname(cur),
                                       dep[len("@loader_path/"):])]
              if dep.startswith("@rpath/"):
                  tail = dep[len("@rpath/"):]
                  return [os.path.join(exedir, tail),
                          os.path.join(exedir, "..", "Frameworks", tail),
                          os.path.join(os.path.dirname(cur), tail)]
              return None

          # plugins are dlopen'd, so nothing links them - walk them explicitly
          import glob
          queue = [(r, os.path.dirname(r)) for r in roots]
          for p in glob.glob("dist/imageqt.app/Contents/PlugIns/*/*.dylib"):
              queue.append((p, "dist/imageqt.app/Contents/MacOS"))
          while queue:
              cur, exedir = queue.pop()
              key = os.path.realpath(cur)
              if key in seen:
                  continue
              seen.add(key)
              for d in deps(cur):
                  if d.startswith(SYSTEM):
                      continue
                  cands = resolve(d, cur, exedir)
                  if cands is not None:
                      hit = next((c for c in cands if os.path.exists(c)), None)
                      if hit:
                          queue.append((hit, exedir))
                      else:
                          external[d + "  (missing from the bundle)"].add(
                              os.path.basename(cur))
                      continue
                  external[d].add(os.path.basename(cur))
                  if os.path.exists(d):
                      queue.append((d, exedir))

          lines = ["## macOS dependency audit", ""]
          if external:
              lines.append(f"**NOT STANDALONE** - {len(external)} "
                           "dependencies outside the system paths:")
              lines.append("")
              lines.append("| dependency | needed by |")
              lines.append("| --- | --- |")
              for d in sorted(external):
                  lines.append(f"| `{d}` | {', '.join(sorted(external[d]))} |")
              lines.append("")
              lines.append("A user without these installed cannot run the "
                           "binaries.  Bundling them (macdeployqt for Qt, "
                           "dylibbundler for the rest) is the fix.")
          else:
              lines.append("**STANDALONE** - every dependency resolves to "
                           "/usr/lib, /System/Library or @rpath.")

          report = "\n".join(lines)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(report + "\n")
          if external and strict:
              sys.exit(1)
          PY

      # Dynamic half.  The static audit cannot see plugins, and Qt dlopens
      # its platform plugin at runtime, so hide Homebrew entirely and try
      # again.  Everything Homebrew owns lives under Cellar; lib/ and opt/
      # are symlinks into it, so one move breaks the lot, reversibly.
      - name: Re-run with Homebrew hidden
        if: always()
        env:
          STRICT: ${{ vars.STRICT_STANDALONE || '0' }}
        run: |
          set -o pipefail
          CELLAR="$(brew --prefix)/Cellar"
          # restore() has to end in a success.  It also runs as an EXIT trap,
          # by which point the explicit call below has already moved the
          # directory back, so the test fails - and under the bash -e that
          # Actions uses, a trap whose last command fails becomes the script's
          # exit status.  That reddened the job even though every command in
          # it had done exactly what was intended.
          restore() {
            if [ -d "$CELLAR.hidden" ]; then sudo mv "$CELLAR.hidden" "$CELLAR"; fi
            return 0
          }
          trap restore EXIT
          sudo mv "$CELLAR" "$CELLAR.hidden"

          rc=0
          dist/gen-bitmap time22:00 map1 > nohomebrew.log 2>&1 || rc=$?
          QT_QPA_PLATFORM=offscreen IMAGEQT_SHOT=nohomebrew.png \
            dist/imageqt.app/Contents/MacOS/imageqt time22:00 map1 \
              >> nohomebrew.log 2>&1 || rc=$?
          restore

          echo "== output with Homebrew hidden (exit $rc)"
          cat nohomebrew.log || true
          {
            echo "## Run without Homebrew"
            echo
            if [ "$rc" -eq 0 ]; then
              echo "Both tools started with Homebrew hidden - genuinely standalone."
            else
              echo "Exit $rc: the binaries need Homebrew present. This is the"
              echo "condition a user without Homebrew would hit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Informational, like the audit above: the bundle is known not to be
          # standalone, and a red job would only restate that.  Same switch.
          if [ "$rc" -ne 0 ] && [ "$STRICT" = "1" ]; then
            echo "STRICT_STANDALONE is set - reporting this as a failure"
            exit 1
          fi
          exit 0
